<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13804a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FoodMadeEasy">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>FoodMadeEasy Prototype</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="stage">
    <div class="phone"><div id="app"></div></div>
    <aside id="dev" class="dev-panel"></aside>
  </div>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/offers.js"></script>
  <script src="js/mix.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-da.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens-start.js"></script>
  <script src="js/screens-week.js"></script>
  <script src="js/screens-mix.js"></script>
  <script src="js/screens-shop.js"></script>
  <script src="js/screens-prep.js"></script>
  <script src="js/screens-profile.js"></script>
  <script src="js/dev.js"></script>
  <script>
    render();
    // Offline support on the hosted site only; local development always loads fresh files.
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then((reg) => reg.update()).catch(() => { /* offline support is optional */ });
      // A new version took over: reload once so the screen shows it right away.
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then((r) => r && r.update());
      });
    }
  </script>
</body>
</html>
